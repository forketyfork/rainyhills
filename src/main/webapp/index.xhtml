<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<body>

<ui:composition template="./WEB-INF/template.xhtml">

    <ui:define name="heading">#{messages.headerIndex}</ui:define>

    <ui:define name="content">
        <div class="row">
            <h:form styleClass="col-sm-8 #{facesContext.validationFailed ? 'has-danger' : ''}">
                <h3>#{messages.headerInputForm}</h3>

                <div class="form-group row">
                    <label for="calculationDataInput"
                           class="col-sm-3 col-form-label">#{messages.inputFormArrayField}</label>
                    <div class="col-sm-9">
                        <h:inputText id="calculationDataInput"
                                     styleClass="form-control #{!component.valid ? 'form-control-danger' : ''}"
                                     value="#{calculationData.input}"
                                     converter="com.forketyfork.rainyhills.faces.IntegerListConverter"
                                     aria-describedby="calculationDataInputHelp"/>
                        <small id="calculationDataInputHelp"
                               class="text-muted">#{messages.inputFormArrayFieldHelp}</small>
                        <div class="form-control-feedback">
                            <h:message for="calculationDataInput" showSummary="true" showDetail="true"/>
                        </div>
                    </div>
                </div>
                <h:commandButton styleClass="btn btn-primary float-right"
                                 value="#{messages.inputFormCalculateButton}"
                                 action="#{calculation.calculateAction}"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>

</body>
</html>
