<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="./WEB-INF/template.xhtml">

    <ui:define name="heading">#{messages.headerResult}</ui:define>

    <ui:define name="content">
        <div class="row">
            <h:form styleClass="col-sm-8">
                <div class="form-group row">
                    <label class="col-sm-3 col-form-label">#{messages.resultFormArrayField}</label>
                    <div class="col-sm-9">
                        <p class="form-control-static">#{calculationData.input}</p>
                    </div>
                    <label class="col-sm-3 col-form-label">#{messages.resultFormResultField}</label>
                    <div class="col-sm-9">
                        <p class="form-control-static">#{calculationData.result}</p>
                    </div>
                </div>
                <h:commandButton styleClass="btn btn-warning float-right"
                                 action="index"
                                 value="#{messages.resultFormRepeatButton}"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>

</html>
